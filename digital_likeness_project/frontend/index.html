<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Likeness Uploader & Chat</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        .app-container { width: 100%; max-width: 700px; background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.1); margin-top: 20px; margin-bottom: 20px;}
        h1, h2 { text-align: center; color: #333; }
        .form-container, .upload-container, .chat-ui-container { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; color: #555; }
        input[type="text"], input[type="password"], input[type="file"], textarea {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 5px;
        }
        button:disabled { background-color: #a0cfff; cursor: not-allowed; }
        button:hover:not(:disabled) { background-color: #0056b3; }
        .hidden { display: none !important; }
        #messages { margin-top: 15px; padding: 10px; border-radius: 4px; word-wrap: break-word; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .navigation-bar { margin-bottom: 20px; text-align: center; }
        .navigation-bar button { background-color: #6c757d; }
        .navigation-bar button:hover:not(:disabled) { background-color: #545b62; }
        .navigation-bar button.active { background-color: #007bff; }

        #chat-display-area {
            height: 300px;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 10px;
            background-color: #f9f9f9;
        }
        .message-bubble {
            padding: 8px 12px;
            border-radius: 15px;
            margin-bottom: 8px;
            max-width: 70%;
            word-wrap: break-word;
            clear: both;
        }
        .user-message {
            background-color: #007bff;
            color: white;
            float: right;
            border-bottom-right-radius: 5px;
        }
        .bot-message {
            background-color: #e9ecef;
            color: #333;
            float: left;
            border-bottom-left-radius: 5px;
        }
        .bot-fallback-message { /* Optional styling for fallback messages */
            background-color: #fff3cd; /* A light yellow, for example */
            border: 1px solid #ffeeba;
        }
        .message-sender { font-weight: bold; font-size: 0.8em; margin-bottom: 2px; }
        .message-timestamp { font-size: 0.7em; color: #6c757d; margin-top: 2px; display: block; }
        #chat-input-area { display: flex; margin-bottom: 5px; }
        #chat-input-area textarea { flex-grow: 1; margin-right: 10px; height: 40px; resize: none;}
        #chat-input-area textarea:disabled { background-color: #e9ecef; }
        #chat-input-area button { height: 40px; }

        /* Loading indicator is now created dynamically by Chat.js, its style is set there. */
        /* #chat-loading-indicator { font-style: italic; color: #555; padding: 5px 0; height: 20px; text-align: center; } */


        #deleteHistoryButton { background-color: #ffc107; color: #333; }
        #deleteHistoryButton:hover:not(:disabled) { background-color: #e0a800; }
        #logoutButton { background-color: #dc3545; margin-top: 10px; } /* This is in nav bar now, margin-top might not be needed */
        #logoutButton:hover:not(:disabled) { background-color: #c82333; }

    </style>
</head>
<body>
    <div class="app-container">
        <h1>Digital Likeness Project</h1>

        <div id="login-section">
            <h2>Login</h2>
            <div id="login-form-container" class="form-container"></div>
        </div>

        <div id="app-content" class="hidden">
            <div class="navigation-bar">
                <button id="navToUpload">Upload Files</button>
                <button id="navToChat">Chat</button>
                <button id="logoutButton">Logout</button>
            </div>

            <div id="upload-section" class="hidden">
                <h2>Upload Text File</h2>
                <div id="file-upload-container" class="upload-container"></div>
            </div>

            <div id="chat-section" class="hidden">
                <h2>Chat with your Likeness</h2>
                <div id="chat-ui-container">
                    <!-- Chat interface will be rendered here by Chat.js -->
                </div>
            </div>
        </div>

        <div id="messages"></div>
    </div>

    <script src="src/components/Login.js"></script>
    <script src="src/components/FileUpload.js"></script>
    <script src="src/components/Chat.js"></script>
    <script src="src/app.js"></script>
</body>
</html>
